[package]
name = "opswitness-desktop"
version = "0.1.0-alpha.2"
description = "Native macOS shell and runtime supervisor for OpsWitness"
authors = ["Tianyu Zhou"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
fs2 = "0.4.3"
hex = "0.4.3"
nix = { version = "0.30.1", features = ["signal"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.8.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.0.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
