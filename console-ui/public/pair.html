<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#19786e" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/pair.css" />
    <title>Pair this device · Quarterdeck</title>
  </head>
  <body>
    <main class="pair-shell">
      <header>
        <img src="/icons/quarterdeck-192.png" alt="" width="52" height="52" />
        <div><span>QUARTERDECK</span><h1>Pair this device</h1></div>
      </header>
      <p class="intro">Enter the one-time code shown on your Mac. The code expires shortly and can be used once.</p>
      <form id="pair-form">
        <label>
          <span>Device name</span>
          <input id="device-name" name="device_name" maxlength="80" autocomplete="off" required />
        </label>
        <label>
          <span>Pairing code</span>
          <input id="pairing-code" name="code" maxlength="20" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX" required />
        </label>
        <p id="pair-error" class="error" role="alert" hidden></p>
        <button type="submit">Pair and open workspace</button>
      </form>
      <footer>
        <strong>Private by design</strong>
        <span>Quarterdeck stores a revocable device credential in a secure browser cookie. Task data is never cached for offline use.</span>
        <small lang="zh-CN">在 Mac 上运行 qd console pair 获取一次性配对码。</small>
      </footer>
    </main>
    <script src="/pair.js" defer></script>
  </body>
</html>
