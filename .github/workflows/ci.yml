name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
        working-directory: console-ui
      - run: npm run typecheck
        working-directory: console-ui
      - run: npm run build
        working-directory: console-ui
      - run: git diff --exit-code -- src/quarterdeck/console/static
      - run: python -m pip install -e ".[dev,mcp]" build
      - run: ruff check .
      - run: mypy src/quarterdeck
      - run: pytest -q
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - run: python scripts/build_manifest.py dist
      - run: python examples/showcase/run.py --output "${RUNNER_TEMP}/showcase"
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - name: Verify DCO signoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
