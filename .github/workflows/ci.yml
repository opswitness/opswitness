name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
        working-directory: console-ui
      - run: npm run typecheck
        working-directory: console-ui
      - run: npm run build
        working-directory: console-ui
      - run: git diff --exit-code -- src/quarterdeck/console/static
      - run: python -m pip install -e ".[dev,mcp]" build
      - run: ruff check .
      - run: mypy src/quarterdeck
      - run: pytest -q
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - run: python scripts/build_manifest.py dist
      - run: python examples/showcase/run.py --output "${RUNNER_TEMP}/showcase"
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Verify DCO signoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.11"
          cache: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - name: Scan full git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" version
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose .
