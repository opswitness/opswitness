name: release
on:
  push:
    tags: ["v0.1.0-alpha.1"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release identity to validate without publishing
        required: true
        default: v0.1.0-alpha.1

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  preflight:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unapproved public tag
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLIC_RELEASE_APPROVED != 'true'
        run: |
          echo "PUBLIC_RELEASE_APPROVED=true is required before any tagged build or attestation."
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with: { fetch-depth: 0 }
      - name: Require the tag to point at main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
  quality:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
        working-directory: console-ui
      - run: npm test
        working-directory: console-ui
      - run: npm run typecheck
        working-directory: console-ui
      - run: npm run build
        working-directory: console-ui
      - run: git diff --exit-code -- src/opswitness/console/static
      - run: python -m pip install -e ".[dev,mcp]" build
      - run: python scripts/check_release_identity.py --tag "$RELEASE_TAG"
      - run: ruff check .
      - run: mypy src/opswitness
      - run: pytest -q
      - run: git diff --check
      - run: test -z "$(git status --porcelain --untracked-files=all)"
  dco:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - run: python .github/scripts/check_dco.py 0000000000000000000000000000000000000000 "$GITHUB_SHA"
  gitleaks:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: [preflight, quality, dco, gitleaks]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - run: npm ci
        working-directory: console-ui
      - run: npm run build
        working-directory: console-ui
      - run: git diff --exit-code -- src/opswitness/console/static
      - run: python -m pip install build
      - run: python scripts/check_release_identity.py --tag "$RELEASE_TAG"
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          artifact-name: distribution-sbom.spdx.json
          upload-release-assets: false
      - run: python scripts/build_manifest.py dist --tag "$RELEASE_TAG" --require-sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLIC_RELEASE_APPROVED == 'true'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Verify downloaded release asset hashes
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest distributions
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
            dist/build-manifest.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
