name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unapproved public tag
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLIC_RELEASE_APPROVED != 'true'
        run: |
          echo "PUBLIC_RELEASE_APPROVED=true is required before any tagged build or attestation."
          exit 1
  build:
    needs: preflight
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - run: python scripts/build_manifest.py dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          artifact-name: distribution-sbom.spdx.json
          upload-release-assets: false
      - name: Attest distributions
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLIC_RELEASE_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
