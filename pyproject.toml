[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quarterdeck"
version = "0.0.1"
description = "Run long-lived AI work with approvals, evidence, and recoverable execution — a local-first bridge for Paperclip fleets."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tianyu Zhou" }]
keywords = ["agents", "approvals", "audit", "paperclip", "control-plane", "launchd", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
telegram = ["python-telegram-bot>=22"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
qd = "quarterdeck.cli:app"

[project.urls]
Homepage = "https://github.com/tianyuzhou/quarterdeck"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
