[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opswitness"
version = "0.1.0a1"
description = "A local-first AI workforce console with planning, approvals, evidence, and recoverable execution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Tianyu Zhou" }]
keywords = ["agents", "approvals", "audit", "paperclip", "control-plane", "launchd", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "psutil>=6.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  "packaging>=24",
]

[project.scripts]
opswitness = "opswitness.cli:app"
qd = "opswitness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opswitness"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
  "src",
  "console-ui",
  "docs",
  "examples",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "CHANGELOG.md",
  "pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "*.pyc",
  "/console-ui/node_modules",
]

[project.urls]
Homepage = "https://github.com/opswitness/opswitness"
Repository = "https://github.com/opswitness/opswitness"
Issues = "https://github.com/opswitness/opswitness/issues"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
